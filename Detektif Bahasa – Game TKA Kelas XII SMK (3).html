<script>
var R=[
{t:"Memahami Teks",c:"Kasus 1: Perpustakaan Hilang",s:"Semalam, buku langka di Perpustakaan Aksara raib. Pelaku meninggalkan tulisan-tulisan sebagai jejak. Baca dengan teliti dan pecahkan setiap petunjuk!",p:"Pelaku tertangkap: penjaga malam yang menyalin naskah untuk dijual. Buku langka kembali ke rak.",ch:["Hujan baru reda ketika Detektif Rani tiba di Perpustakaan Aksara pukul tujuh pagi. Lampu ruang koleksi langka masih menyala, kaca etalase pecah, dan sebuah buku tua bersampul kulit hijau lenyap dari raknya. Pak Darman, penjaga malam, duduk gemetar di kursi dekat pintu. “Saya tidak melihat siapa pun masuk,” katanya terbata-bata. Rani membuka buku catatan, mengamati sekeliling, lalu mulai mencatat keterangan saksi satu per satu, termasuk pendapat orang-orang yang mulai berkerumun di halaman perpustakaan.\nRani memotret etalase dari tiga sudut, lalu menyusuri lorong menuju ruang baca. Di sana, debu di lantai terlihat terseka membentuk garis tipis menuju pintu belakang. Seorang petugas kebersihan, Mbak Lastri, mengaku mendengar langkah kaki dan suara kunci diputar sekitar pukul dua dini hari. Rani menandai kesaksian itu di bukunya dan berjanji memeriksanya kembali.", "Menjelang siang, kabar pencurian menyebar ke seluruh kota. Seorang tetangga, Bu Sinta, mengirim surat panjang ke kantor polisi. Ia menuliskan alasan demi alasan mengapa penjaga malam patut dicurigai, lengkap dengan jadwal ronda yang janggal. Di meja Rani juga ada selembar kertas lusuh berisi petunjuk membuka lemari arsip di ruang bawah tanah. Sementara itu, surat kabar sore memuat sebuah tulisan bernada tegas tentang jam buka perpustakaan yang dianggap terlalu singkat.\nRani memeriksa surat Bu Sinta dengan teliti. Tulisan tangannya miring dan tinta di beberapa tempat menembus kertas, tanda penulisnya menekan pena kuat-kuat saat marah. Ketika Rani mencocokkan jadwal ronda dengan catatan jaga, ia menemukan selisih satu jam yang belum bisa dijelaskan oleh siapa pun. Rani menyimpan selisih itu sebagai teka-teki yang harus dipecahkan malam nanti.", "Di kantor polisi, suasana tegang mereda sejenak ketika Sersan Budi menceritakan kisah lucu tentang seorang polisi yang sibuk mencari kacamata padahal terpasang di kepalanya sendiri. Rani tersenyum, tetapi pikirannya tetap pada kasus. Ia teringat bahwa semalam hujan lebat mengguyur kota hingga atap ruang arsip bocor. Ia segera menulis penjelasan tentang kejadian itu, lalu bersiap menyusun laporan hasil pengamatannya atas ruang arsip yang berantakan, dari pintu masuk hingga rak paling ujung.\nSersan Budi menawarkan secangkir teh, tetapi Rani menolak karena ingin segera kembali ke ruang arsip. Di tengah jalan, ia berpapasan dengan Pak Wali yang tampak gelisah menanyakan perkembangan penyelidikan. Rani menjawab sopan bahwa semua petunjuk sedang disusun, lalu kembali menunduk pada catatannya, sadar bahwa waktunya tinggal sedikit sebelum jejak pelaku memudar.", "Rani kembali ke perpustakaan sore itu. Di lantai ruang arsip, genangan air membasahi tumpukan kertas tua. Seorang kolektor bernama Pak Hendra datang dan menyampaikan ulasan panjang tentang buku yang hilang, menyebut kelebihan dan kekurangannya sebagai karya sejarah. Para saksi lain bercerita panjang lebar, dan Rani harus pandai memilah mana yang penting. Setiap paragraf ia garis bawahi, mencari inti yang disampaikan di antara kalimat-kalimat pendukung yang berputar-putar.\nPak Hendra bersikeras bahwa buku itu adalah satu dari tiga eksemplar yang tersisa di dunia. Ia menunjukkan foto lama sampul buku tersebut, dan Rani memperhatikan sebuah goresan kecil di sudutnya. Goresan itulah yang kelak menjadi tanda pengenal ketika buku ditemukan. Sebelum pulang, Pak Hendra meminta Rani berjanji akan mengembalikan buku itu dalam keadaan utuh.", "Malam tiba. Rani membaca ulang laporan resmi perpustakaan yang menyebut arsip kota sebagai benda yang sangat penting bagi sejarah. Ia menemukan sebuah nama yang berulang pada daftar peminjam. Anehnya, orang itu selalu tampil penuh keyakinan, sementara rekannya justru selalu ragu dan merasa khawatir. Di akhir hari, ayah Rani, seorang pustakawan tua, meneleponnya dan berpesan agar ia tetap bersabar, sebab ayahnya sendiri telah bekerja sangat keras sepanjang hidupnya demi keluarga.\nRani menutup laporannya dan menatap langit-langit ruang arsip yang masih meneteskan air. Ia tahu pelaku pasti memanfaatkan kebocoran itu untuk menyamarkan jejaknya. Dengan lentera di tangan, ia menelusuri rak demi rak hingga menemukan sehelai kertas basah terselip di balik buku besar. Kertas itu bertuliskan sebuah alamat yang membuat jantungnya berdegup kencang."],mc:[["Letak kalimat utama pada paragraf di atas menunjukkan bahwa paragraf tersebut bersifat …", ["induktif", "deduktif", "campuran", "naratif"], 1, "Perpustakaan Aksara menyimpan banyak koleksi langka. Buku sejarah kota tersimpan di rak kaca, naskah kuno dirawat di ruang berpendingin, dan peta lama dibingkai di dinding timur. Petugas menjaga semuanya dengan ketat sepanjang hari, bahkan saat jam istirahat. Rani mencatat bahwa penjagaan sebaik itu seharusnya sulit ditembus siapa pun."], ["Berdasarkan teks, pernyataan yang merupakan opini adalah …", ["Buku hilang pukul dua dini hari.", "Pencurinya pasti orang yang sangat licik.", "Pintu belakang terbuka pukul 02.10.", "Pintu tertutup kembali pukul 02.25."], 1, "Pak Darman berkata kepada Rani, “Buku itu hilang pukul dua dini hari.” Bu Ratna menimpali, “Pencurinya pasti orang yang sangat licik.” Sementara itu, catatan jaga menunjukkan pintu belakang terbuka pukul 02.10 dan tertutup kembali pukul 02.25. Rani menggarisbawahi ketiga keterangan itu dalam buku catatannya."], ["Kalimat “Sebaiknya perpustakaan memasang kamera pengawas di setiap ruangan” dalam teks merupakan …", ["fakta", "opini", "data", "definisi"], 1, "Wali kota Aksara meminta Rani berhati-hati. “Menurut saya, sebaiknya perpustakaan memasang kamera pengawas di setiap ruangan,” katanya. Rani mengangguk, lalu mencatat bahwa sebelumnya perpustakaan hanya memiliki dua kamera, satu di pintu depan dan satu di meja resepsionis. Kamera itu sudah rusak sejak bulan lalu."], ["Surat Bu Sinta tergolong teks argumentasi karena …", ["berisi langkah-langkah kerja", "berisi pendapat yang didukung alasan", "menceritakan perjalanan hidup", "menggambarkan ciri sebuah benda"], 1, "Bu Sinta menulis surat untuk polisi. “Penjaga malam patut diperiksa. Pertama, ia satu-satunya orang yang memegang kunci ruang arsip. Kedua, ia tidak bisa menjelaskan keberadaannya pukul dua. Ketiga, ia sering mengeluh gajinya kecil. Karena itu, polisi wajib memeriksanya.”"], ["Teks di atas termasuk teks prosedur karena …", ["memuat urutan langkah melakukan sesuatu", "menyindir tokoh tertentu", "menjelaskan proses alam", "menilai sebuah buku"], 0, "Pak Darman menunjukkan cara membuka lemari arsip kepada Rani. Pertama, masukkan kunci kuningan ke lubang bawah. Kedua, putar kunci ke kiri dua kali. Ketiga, tarik laci sambil menekan tuas samping. Terakhir, tutup kembali laci dan kunci seperti semula agar arsip aman."], ["Bagian akhir tulisan yang menegaskan kembali pendapat penulis disebut …", ["tesis", "argumentasi", "penegasan ulang", "orientasi"], 2, "Sebuah tulisan di surat kabar sore berjudul “Perpustakaan Harus Buka Malam Hari”. Penulis berpendapat bahwa jam buka yang singkat menyulitkan pelajar dan pekerja. Ia menyebut bahwa 70 persen pengunjung datang setelah pukul lima sore. Di akhir tulisan, ia menegaskan kembali bahwa jam buka perpustakaan perlu diperpanjang."], ["Teks di atas termasuk anekdot karena …", ["berisi cerita lucu yang menyindir kebiasaan lupa", "menjelaskan proses terjadinya hujan", "memuat langkah memasak", "menilai kualitas buku"], 0, "Di kantor polisi, Sersan Budi bercerita tentang polisi bernama Joko. Pagi itu Joko mengobrak-abrik rumah mencari kacamatanya. Setelah satu jam, istrinya tertawa dan berkata, “Pak, kacamatanya ada di kepalamu.” Joko menjawab, “Pantas saja dari tadi semuanya kelihatan jelas.” Seisi ruangan tertawa mendengarnya."], ["Teks di atas termasuk teks eksplanasi karena …", ["menjelaskan proses terjadinya suatu peristiwa", "membujuk pembaca membeli sesuatu", "menceritakan riwayat hidup", "menyindir tokoh tertentu"], 0, "Hujan deras mengguyur Kota Aksara semalaman. Air yang tak tertampung selokan meluap ke jalan, lalu masuk ke atap ruang arsip yang retak. Akibatnya, air merembes ke lantai dan membasahi tumpukan kertas tua di bawahnya. Rani mencatat urutan kejadian itu dengan saksama sambil memeriksa langit-langit."], ["Kalimat “Ruang arsip adalah ruangan berukuran 8 × 6 meter di lantai bawah” merupakan bagian … dalam laporan hasil observasi.", ["pernyataan umum", "deskripsi bagian", "deskripsi manfaat", "penutup"], 0, "Rani menyusun laporan observasi ruang arsip. Ruang arsip adalah ruangan berukuran 8 × 6 meter di lantai bawah. Ruangan ini terdiri atas rak besi, meja kerja, dan lemari kaca. Rak besi berfungsi menyimpan dokumen, sedangkan lemari kaca menyimpan naskah kuno. Seluruhnya bermanfaat untuk menjaga warisan sejarah kota."], ["Akibat yang terjadi karena petugas memindahkan arsip adalah …", ["atap menjadi bocor", "arsip menjadi kering", "rak bawah dibiarkan kosong tanpa pengawasan", "kamera menjadi rusak"], 2, "Rani menemukan pesan di meja resepsionis. “Atap ruang arsip bocor sehingga arsip menjadi basah. Karena arsip basah, petugas memindahkannya ke ruang lain. Akibatnya, rak bawah dibiarkan kosong tanpa pengawasan.” Rani menyadari bahwa celah itu mungkin dimanfaatkan pelaku untuk masuk tanpa terlihat."], ["Kekurangan buku yang dinilai Pak Hendra adalah …", ["bahasanya sulit dipahami", "ilustrasinya kurang indah", "beberapa bab terlalu panjang dan kurang disertai peta", "tidak layak dibaca pelajar"], 2, "Pak Hendra menulis ulasan tentang buku yang hilang. “Buku bersampul hijau ini menyajikan sejarah Kota Aksara dengan bahasa yang mudah dipahami dan ilustrasi yang indah. Namun, beberapa bab terlalu panjang dan kurang disertai peta pendukung. Buku ini layak dibaca oleh pelajar dan peneliti sejarah.”"], ["Ide pokok paragraf di atas adalah …", ["Banjir sering merusak arsip kota.", "Jamur tumbuh di kertas.", "Petugas rutin memeriksa saluran.", "Tinta melarut di kertas lama."], 0, "Banjir sering merusak arsip kota. Genangan air melarutkan tinta pada kertas lama. Kelembapan juga memicu tumbuhnya jamur yang menggerogoti serat kertas. Karena itu, petugas harus rutin memeriksa atap dan saluran air agar arsip tetap awet dan dapat dibaca oleh generasi berikutnya."], ["Sinonim kata “esensial” dalam teks adalah …", ["pokok", "tambahan", "rumit", "sepele"], 0, "Dalam laporan akhir, Rani menulis bahwa buku bersampul hijau itu bersifat esensial bagi sejarah Kota Aksara karena memuat catatan pendirian kota. Tanpa buku itu, banyak peristiwa penting akan hilang dari ingatan warga. Karena itu, Rani bertekad menemukannya secepat mungkin."], ["Antonim kata “optimis” berdasarkan teks adalah …", ["realistis", "pesimis", "egois", "apatis"], 1, "Di antara para saksi, Rani bertemu Pak Joko yang optimis kasus ini cepat selesai. Namun, Bu Ratna justru pesimis karena jejak pelaku sudah terhapus hujan. Rani mendengarkan keduanya dengan sabar, lalu memilih bersikap realistis dan terus mengumpulkan bukti sedikit demi sedikit."], ["Makna ungkapan “membanting tulang” dalam teks adalah …", ["memukul tulang", "bekerja keras", "sakit tulang", "membuang tulang"], 1, "Ayah Rani bekerja sebagai pustakawan sejak muda. Ia bangun sebelum subuh, pulang larut malam, dan tak pernah mengeluh. Orang-orang menyebutnya sebagai orang yang membanting tulang demi keluarga. Berkat kerja kerasnya, Rani dapat bersekolah hingga SMK dan bercita-cita menjadi detektif."]],
is:[
["Teks yang berisi riwayat hidup seseorang yang ditulis orang lain disebut teks …",["biografi"]],
["Kalimat berisi pendapat pribadi penulis yang belum tentu benar disebut …",["opini"]],
["Bagian akhir teks eksposisi yang menegaskan kembali pendapat disebut …",["penegasan ulang","penegasan ulang pendapat","penegasan ulang tesis"]],
["Kata “banjir” dalam kalimat “Banjir merendam Bekasi” termasuk kelas kata …",["nomina","kata benda","benda"]],
["Antonim kata “mayoritas” adalah …",["minoritas"]]]},
{t:"Kebahasaan dan Ejaan",c:"Kasus 2: Surat Palsu",s:"Surat ancaman palsu beredar di Kota Aksara. Penulisnya ceroboh: ejaan, kata baku, dan majasnya meninggalkan jejak.",p:"Pelaku terungkap dari kebiasaan salah ejaannya: juru ketik kantor kelurahan mengaku.",ch:["Pagi itu, Kota Aksara geger. Sebuah surat ancaman ditemukan terselip di bawah pintu kantor kelurahan. Kertasnya kusut, tintanya luntur, dan isinya penuh kata yang janggal. Detektif Rani membaca surat itu pelan-pelan di bawah lampu meja. Beberapa kata terasa tidak lazim, seolah penulisnya tergesa-gesa atau sengaja menyamarkan kebiasaan menulisnya. Rani mengeluarkan kaca pembesar dan mulai menandai bagian yang mencurigakan, mulai dari pilihan kata hingga cara penulis menempatkan kata depan.\nRani mencium bau kertas itu: samar, seperti aroma tinta toko alat tulis. Ia teringat bahwa hanya satu toko di Kota Aksara yang menjual tinta jenis itu. Namun ia menahan diri untuk tidak terburu-buru; kesimpulan yang tergesa-gesa justru sering menjerumuskan seorang detektif. Ia mencatat semuanya dengan teliti dan menyiapkan daftar pertanyaan untuk esok hari.", "Setelah menandai kata-kata janggal, Rani beralih ke bagian lain surat. Di sana terdapat daftar barang yang diminta pelaku, ditulis tanpa sistem yang jelas. Beberapa nama diawali huruf kecil, padahal seharusnya diawali huruf kapital. Pada bagian akhir, pelaku menyisipkan pengumuman tentang upacara bendera yang entah mengapa ia anggap penting. Rani mencatat bahwa gaya penulisan seperti itu biasanya muncul pada orang yang terbiasa mengetik cepat tanpa memeriksa ulang.\nPak Lurah menceritakan bahwa beberapa hari terakhir, kantornya menerima banyak surat tanpa nama. Isinya bermacam-macam: keluhan, ejekan, hingga lelucon yang dipaksakan. Rani meminta seluruh surat itu dikumpulkan di atas meja. Ia menyusunnya berdasarkan tanggal, lalu mengamati bagaimana kebiasaan salah ketik penulisnya berubah dari hari ke hari.", "Rani meminta bantuan Sersan Budi untuk membandingkan surat itu dengan arsip tulisan warga. Sersan Budi menemukan beberapa kalimat yang bertele-tele, seolah penulisnya ingin tampak pintar tetapi justru memakai kata berlebihan. Ada pula kalimat yang menggantung karena tidak ada kata penghubung yang tepat. Salah satunya berbunyi bahwa seseorang tidak masuk sekolah karena sakit. Rani menggumam bahwa penulis surat ini bukan orang sembarangan, tetapi juga bukan orang yang teliti.\nSersan Budi menggaruk kepalanya, mengaku sulit membedakan tulisan yang benar dan yang salah. Rani menepuk bahunya sambil tersenyum dan berkata bahwa seorang penyelidik yang baik tak perlu menjadi ahli bahasa, cukup sabar membaca. Mereka bekerja hingga lampu kantor berpendar kuning, menyalin kalimat demi kalimat ke papan tulis besar di ruang rapat.", "Menjelang sore, Rani menelusuri kebiasaan penulis dalam menyusun kata berimbuhan. Ia menemukan satu kata yang sering ditulis salah, padahal bentuk bakunya sederhana. Selain itu, surat tersebut penuh gaya bahasa. Penulis menggambarkan wajah korban seindah sinar pagi, lalu menggambarkan kesedihan yang begitu dalam hingga seakan membanjiri rumah. Rani menyadari bahwa penulis suka berlebihan dan gemar memakai perumpamaan, dua ciri yang bisa menjadi kunci penyelidikan.\nDi papan tulis, Rani menggambar tiga lingkaran besar: kebiasaan ejaan, gaya bahasa, dan susunan kalimat. Di tengahnya ia menulis satu nama yang masih berupa tanda tanya. Setiap petunjuk yang ia temukan ia tempelkan sebagai kertas kecil berwarna. Sersan Budi bergumam kagum melihat kertas-kertas itu perlahan membentuk pola yang tak pernah terlihat saat berserakan di meja.", "Malam menjelang ketika Rani membaca bagian paling akhir surat. Di sana tertulis bahwa ombak seolah punya kaki dan sanggup mengejar pantai. Rani tersenyum tipis; kalimat puitis seperti itu jarang ditulis orang yang berniat mengancam. Ia lalu menganalisis struktur beberapa kalimat dan menemukan pola yang sama berulang. Terakhir, ia membaca bahwa pelaku datang ke tempat kejadian dengan kendaraan sederhana beroda dua, sesuai jejak roda yang ditemukan di halaman kelurahan.\nMenjelang tengah malam, Rani mencocokkan jejak roda dengan sepeda milik warga. Ada empat sepeda yang ukurannya sama, dan tiga di antaranya terbukti tidak keluar rumah malam itu. Tinggal satu sepeda tua milik seorang juru ketik kantor kelurahan yang masih menyisakan lumpur basah di rodanya. Rani menutup bukunya, tersenyum, dan berkata pelan, “Sebentar lagi kita bertemu.”"],mc:[["Bentuk baku kata “apotik” dalam surat tersebut adalah …", ["apotik", "apotek", "apotick", "apoteck"], 1, "Surat ancaman itu bertuliskan, “Temui aku di apotik tua di ujung jalan, jangan lupa membawa uang.” Rani mengernyit membaca kata apotik yang terasa janggal. Ia tahu penulis surat itu sering salah menulis kata, tetapi ia belum tahu siapa orangnya."], ["Bentuk baku kata “analisa” dalam surat adalah …", ["analisa", "analisis", "analisys", "analises"], 1, "Dalam surat ancaman terdapat kalimat, “Hasil analisa sidik jari menunjukkan kamu bersalah.” Rani menggarisbawahi kata analisa dengan pensil merah. Menurutnya, penulis surat tidak terbiasa memakai kamus dan hanya menulis berdasarkan kebiasaan lisan."], ["Perbaikan penulisan yang tepat untuk “dikota” dan “dikantor” adalah …", ["di kota dan di kantor", "dikota dan di kantor", "di-kota dan di-kantor", "dikota dan dikantor"], 0, "Surat itu menulis, “Ia tinggal dikota Aksara dan bekerja dikantor kelurahan.” Rani menggeleng karena penulis selalu menyambung kata depan dengan kata di belakangnya. Ia lalu membandingkannya dengan tulisan lain yang benar, seperti “Buku itu ditaruh di meja.”"], ["Penulisan perincian yang benar adalah …", ["Ia membeli apel jeruk, dan mangga.", "Ia membeli apel, jeruk, dan mangga.", "Ia, membeli apel jeruk dan mangga.", "Ia membeli, apel, jeruk dan mangga."], 1, "Daftar permintaan pelaku tertulis, “Ia membeli apel jeruk dan mangga, lalu membayar dengan uang palsu.” Sersan Budi menggeleng membaca daftar tanpa koma itu. Rani membetulkannya sambil menjelaskan bahwa perincian harus dipisah dengan tanda koma."], ["Penulisan huruf kapital yang benar adalah …", ["Saya bekerja di Bank Mandiri, Pulau Jawa.", "saya bekerja di bank Mandiri, pulau Jawa.", "Saya bekerja di bank mandiri, Pulau jawa.", "Saya bekerja di Bank Mandiri, pulau jawa."], 0, "Surat itu menulis, “saya bekerja di bank mandiri, pulau jawa, dan sering bertemu direktur.” Rani menandai bagian yang memakai huruf kecil padahal seharusnya kapital. Ia bergumam bahwa penulisnya pasti terbiasa mengetik tergesa-gesa tanpa memeriksa ulang."], ["Kalimat yang diperbaiki secara efektif adalah …", ["Para siswa dimohon berkumpul di lapangan untuk mengikuti upacara bendera.", "Para siswa-siswa semua dimohon berkumpul di lapangan.", "Siswa-siswa para dimohon berkumpul di lapangan.", "Para siswa-siswa dimohon agar berkumpul di lapangan."], 0, "Pengumuman di surat itu berbunyi, “Para siswa-siswa dimohon berkumpul di lapangan untuk mengikuti upacara bendera.” Rani tersenyum kecil karena penulisnya memakai dua tanda jamak sekaligus. Ia lalu menuliskan perbaikannya di papan tulis ruang rapat."], ["Bagian yang membuat kalimat dalam teks tidak efektif adalah …", ["naik", "ke atas", "panggung", "surat"], 1, "Pelaku menulis, “Aku naik ke atas panggung sambil membawa surat.” Sersan Budi bertanya mengapa kalimat itu terasa janggal. Rani menjelaskan bahwa kata naik sudah mengandung arah ke atas, sehingga tambahan kata ke atas membuat kalimat itu boros kata."], ["Konjungsi yang tepat untuk mengisi titik dalam kalimat pelaku adalah …", ["karena", "tetapi", "agar", "sehingga"], 0, "Pelaku menulis, “Aku tidak masuk kerja kemarin … badanku demam.” Rani menyadari kalimat itu memuat hubungan sebab, yaitu demam adalah alasan ia tidak masuk kerja. Ia lalu memikirkan kata sambung yang paling tepat untuk mengisi titik-titik tersebut."], ["Konjungsi pertentangan yang tepat untuk mengisi titik adalah …", ["dan", "atau", "tetapi", "serta"], 2, "Pelaku menulis, “Aku pintar … kau lebih pintar dariku.” Rani membaca kalimat itu dua kali. Ia tahu kalimat itu memuat dua gagasan yang saling berlawanan sehingga memerlukan kata sambung yang menyatakan pertentangan, bukan penambahan."], ["Bentuk baku dari kata “mempengaruhi” dalam surat adalah …", ["mempengaruhi", "memengaruhi", "memperngaruhi", "mengpengaruhi"], 1, "Beberapa surat itu memakai kata mempengaruhi, merubah, dan nasehat. Rani mengambil kamus besar dari rak dan memeriksanya satu per satu. Ia mencatat bentuk baku tiap kata agar bisa dipakai sebagai bukti kebiasaan penulis."], ["Majas yang digunakan dalam kalimat surat tersebut adalah …", ["metafora", "simile", "hiperbola", "ironi"], 1, "Surat terakhir menggambarkan korban, “Wajahnya secerah mentari pagi dan suaranya semerdu burung bernyanyi.” Rani menggarisbawahi kata secerah dan semerdu, lalu menjelaskan kepada Sersan Budi bahwa penulis membandingkan dua hal yang berbeda memakai kata pembanding."], ["Majas yang digunakan dalam kalimat surat tersebut adalah …", ["personifikasi", "hiperbola", "litotes", "repetisi"], 1, "Dalam surat tertulis, “Tangisnya begitu deras hingga membanjiri seluruh rumah, dan jeritannya mengguncang seluruh kota.” Sersan Budi tertawa membaca kalimat berlebihan itu. Rani menjelaskan bahwa penulis memang gemar melebih-lebihkan setiap keadaan."], ["Majas yang digunakan dalam kalimat penutup surat adalah …", ["personifikasi", "metafora", "ironi", "sinekdoke"], 0, "Penulis surat menutup tulisannya dengan kalimat puitis, “Ombak berlari mengejar pantai, sementara angin berbisik di telinga malam.” Rani merasa penulis ini pasti gemar membaca puisi. Ia mencatat gaya itu sebagai salah satu ciri khasnya."], ["Jenis kalimat yang dianalisis Rani adalah kalimat …", ["tunggal", "majemuk setara", "majemuk bertingkat", "imperatif"], 2, "Rani menganalisis kalimat dari surat itu, “Adik menangis karena mainannya rusak.” Ia membagi kalimat menjadi dua bagian, yaitu “Adik menangis” dan “mainannya rusak”, yang dihubungkan oleh kata karena. Ia lalu menentukan jenis kalimat itu untuk dicatat di papan."], ["Imbuhan ber- pada kata “bersepeda” bermakna …", ["memiliki", "mengendarai", "saling", "kumpulan"], 1, "Pelaku menulis bahwa ia datang ke tempat kejadian dengan cara bersepeda, sementara temannya berjalan kaki. Rani mengamati bekas roda di halaman kelurahan dan mencocokkannya dengan sepeda tua di gudang. Imbuhan pada kata bersepeda ia catat sebagai petunjuk."]],

{t:"Menulis dan Sastra",c:"Kasus 3: Naskah Pidato Lenyap",s:"Naskah pidato wali kota lenyap sebelum acara dimulai. Hanya detektif yang paham surat, proposal, dan sastra yang bisa menemukannya.",p:"Naskah ditemukan di belakang panggung, dan pelakunya mengaku: seorang asisten yang iri pada sang penulis.",ch:["Sehari sebelum peringatan Hari Jadi Kota Aksara, naskah pidato wali kota lenyap dari ruang kerjanya. Detektif Rani dipanggil ke balai kota. Di meja sekretaris, ia menemukan setumpuk berkas lamaran kerja yang belum dibuka. Salah satunya ditulis rapi oleh seorang pemuda bernama Dimas, yang melamar sebagai asisten kantor. Rani mengamati surat itu dengan saksama, memeriksa lampiran, perihal, dan ragam bahasa yang dipakai, sebab ia curiga ada petunjuk tersembunyi di dalamnya.\nDimas ternyata sedang tidak ada di tempat. Kata sekretaris, ia sudah dua hari tidak masuk dan hanya meninggalkan sepucuk pesan singkat. Rani meminta pesan itu dan membacanya dua kali. Gaya bahasanya sopan sekali, terlalu sopan untuk seseorang yang sedang terburu-buru. Rani merasa ada yang sengaja disembunyikan di balik kalimat-kalimat yang terlalu rapi itu.", "Rani terus memeriksa berkas Dimas. Ada daftar riwayat hidup yang sangat lengkap dan sebuah proposal kegiatan literasi yang ia ajukan ke balai kota. Alasan kegiatan, tujuan, dan anggaran semuanya disusun teratur. Rani mengagumi ketelitian itu. Namun di sela berkas, ia menemukan sebuah cerpen misteri tulisan Dimas yang belum selesai. Ceritanya tentang seseorang yang menghilangkan sebuah naskah penting, sebuah kebetulan yang membuat bulu kuduk Rani berdiri.\nDi bagian akhir proposal, Dimas menulis harapan agar balai kota membuka perpustakaan keliling untuk anak-anak. Tulisannya tulus dan bersemangat. Rani mulai ragu apakah pemuda seperti ini sanggup mencuri naskah pidato. Namun ia tahu, kejujuran dalam tulisan belum tentu sama dengan kejujuran dalam perbuatan. Ia menutup berkas itu perlahan dan menyalin beberapa catatan penting.", "Rani membaca cerpen itu hingga habis. Dalam cerita itu, sang tokoh utama, seorang detektif, bercerita memakai kata “aku”. Ketegangan meningkat saat pelaku nyaris tertangkap di ruang arsip, lalu mencapai puncaknya ketika lampu padam mendadak. Pada paragraf pembuka, penulis menyebut waktu kejadian dengan sangat jelas: pagi hari, ketika para tokoh berangkat menuju sekolah. Rani mencatat gaya bercerita itu karena rasanya sangat mirip dengan catatan harian di meja sekretaris.\nRani menghela napas. Cerpen itu berakhir menggantung, seolah penulisnya sengaja meninggalkan satu halaman terakhir agar dibaca seseorang. Ia membalik lembar terakhir dan menemukan sebuah denah kecil yang digambar dengan pensil, menunjukkan sebuah ruangan di belakang panggung balai kota. Tanda silang merah di sudut denah itu membuat Rani berdiri dan meraih mantelnya.", "Di balik cerpen itu, Rani menemukan lembaran puisi. Baris-barisnya penuh pengulangan bunyi yang indah, seakan penulisnya ingin menyampaikan sesuatu lewat irama. Satu baris bercerita tentang kesedihan di tepian, baris lain tentang sunyi yang berdesis. Rani menyadari bahwa pilihan kata sang penyair sangat disengaja: ia memilih kata yang terdengar anggun alih-alih kata sehari-hari. Rani menyalin puisi itu ke bukunya, yakin bahwa di dalamnya tersimpan jejak yang menuntunnya pada naskah yang hilang.\nSersan Budi masuk membawa kabar bahwa seorang petugas melihat bayangan seseorang di belakang panggung semalam. Rani menunjukkan puisi itu kepadanya dan membacakan baris demi baris dengan suara pelan. Mereka sama-sama terdiam ketika menyadari bahwa huruf pertama setiap baris, jika dirangkai, membentuk sebuah kata yang menuntun mereka pada satu nama: Anggun.", "Rani menyusun laporan penyelidikan malam itu. Ia mengutip langsung pernyataan dua saksi dan mencantumkan sumber bacaan yang ia pakai untuk memahami gaya tulisan Dimas. Di akhir laporan, ia merapikan daftar pustakanya dengan teliti. Setelah itu, ia menghadiri rapat tim detektif untuk membahas temuan hari itu. Hasil rapat dicatat dengan rapi oleh Sersan Budi. Esok pagi, Rani akan menunjukkan semua bukti ke wali kota, dan naskah pidato itu akan ditemukan.\nDengan semua bukti di tangan, Rani menyusun rencana. Ia akan datang lebih awal ke balai kota dan menunggu di belakang panggung. Sersan Budi menyiapkan dua petugas untuk berjaga di pintu belakang. Rani mematikan lampu ruang kerja, menatap kota yang mulai sunyi dari jendela, lalu berbisik pada dirinya sendiri bahwa kasus ini tinggal selangkah lagi dari akhir."],mc:[["Berdasarkan teks, lampiran yang disertakan Dimas dalam surat lamaran adalah …", ["daftar riwayat hidup, fotokopi ijazah SMK, dan pas foto", "puisi, cerpen, dan proposal", "foto keluarga dan daftar belanja", "resep masakan dan surat kabar"], 0, "Dimas melamar sebagai asisten kantor balai kota. Dalam suratnya ia menulis, “Bersama surat ini saya lampirkan daftar riwayat hidup, fotokopi ijazah SMK, dan pas foto terbaru.” Rani memeriksa lampiran itu satu per satu dan menemukan semuanya lengkap dan tersusun rapi."], ["Menurut teks, bagian “Hal” dalam surat berfungsi untuk …", ["menyatakan tanggal pembuatan surat", "memberi tahu maksud atau perihal surat", "menunjukkan alamat pengirim", "menyebut nama penerima surat"], 1, "Di bagian atas surat lamaran Dimas tertulis, “Hal: Lamaran Pekerjaan”. Rani bertanya kepada sekretaris mengapa bagian itu wajib ada. Sekretaris menjelaskan bahwa bagian tersebut memberi tahu penerima surat tentang maksud surat sebelum ia membaca isinya."], ["Surat Dimas lebih sesuai sebagai surat lamaran karena menggunakan bahasa …", ["baku dan sopan", "gaul dan santai", "kiasan", "bebas tanpa aturan"], 0, "Rani membandingkan dua surat lamaran. Surat Dimas berbunyi, “Dengan hormat, saya bermaksud melamar pekerjaan di kantor Bapak.” Surat kedua berbunyi, “Halo Bos, gue mau kerja di sini, ya!” Sekretaris langsung menyisihkan surat kedua karena bahasanya dianggap tidak pantas."], ["Isi yang sudah dimuat dalam daftar riwayat hidup Dimas adalah …", ["data diri, pendidikan, dan pengalaman", "resep dan harga bahan", "puisi dan cerpen", "jadwal rapat dan notula"], 0, "Daftar riwayat hidup Dimas memuat nama lengkap, tempat dan tanggal lahir, alamat, riwayat pendidikan dari SD sampai SMK, serta pengalaman magang di perpustakaan kota selama enam bulan. Rani menilai isinya lengkap karena tidak ada keterangan penting yang terlewat."], ["Bagian proposal yang menjelaskan alasan kegiatan diadakan adalah …", ["latar belakang", "anggaran", "jadwal", "tujuan"], 0, "Dimas mengajukan proposal kegiatan literasi. Bagian awalnya berjudul Latar Belakang, yang menjelaskan bahwa banyak anak di Kota Aksara jarang membaca karena kekurangan buku. Bagian berikutnya memuat tujuan, jadwal, dan rincian anggaran sebesar dua juta rupiah."], ["Tokoh, latar, alur, dan amanat dalam cerpen tersebut termasuk unsur …", ["intrinsik", "ekstrinsik", "sosial", "historis"], 0, "Rani membaca cerpen Dimas. Tokohnya seorang detektif muda bernama Laras. Peristiwa terjadi di sebuah gedung tua pada malam hari. Alur ceritanya bergerak dari penemuan jejak hingga pelaku tertangkap. Pesan yang ingin disampaikan penulis adalah bahwa kejujuran lebih berharga daripada kemenangan."], ["Bagian alur yang menunjukkan ketegangan memuncak pada teks tersebut disebut …", ["klimaks", "eksposisi", "koda", "orientasi"], 0, "Dalam cerpen itu, Laras menyelinap ke ruang arsip. Ia menemukan surat rahasia, lalu mendengar langkah kaki mendekat. Lampu padam, napasnya tertahan, dan pintu perlahan terbuka. Pada saat itulah sosok bertopeng muncul dan menatapnya tajam. Ketegangan memuncak hingga pembaca ikut menahan napas."], ["Sudut pandang yang digunakan dalam kutipan cerpen tersebut adalah …", ["orang pertama", "orang ketiga", "serba tahu", "orang kedua"], 0, "Cerpen Dimas dibuka dengan kalimat, “Aku melangkah pelan di lorong gelap itu. Jantungku berdegup kencang, dan tanganku gemetar memegang senter.” Rani membaca kalimat itu dan merasa seakan-akan ia sendiri yang berada di dalam cerita."], ["Latar waktu dalam kutipan cerpen tersebut adalah …", ["pukul enam pagi", "di sekolah", "di jalan berkabut", "di daun yang berembun"], 0, "Paragraf kedua cerpen itu berbunyi, “Pukul enam pagi, kami berangkat ke sekolah dengan mengayuh sepeda. Embun masih menempel di daun, dan kabut tipis menyelimuti jalan.” Rani mencatat gambaran suasana itu karena menurutnya penulisnya pandai melukis suasana."], ["Pengulangan bunyi vokal i pada puisi tersebut disebut …", ["asonansi", "aliterasi", "rima akhir", "enjambemen"], 0, "Di lembar puisi, Rani membaca, “Sedih nian di tepian, sunyi kian menyimpan nian.” Ia memperhatikan bunyi vokal i yang berulang di banyak kata, seperti sedih, nian, tepian, dan kian. Pengulangan itu menciptakan irama lembut yang menenangkan telinga."], ["Pengulangan bunyi konsonan s dalam puisi tersebut disebut …", ["asonansi", "aliterasi", "rima", "diksi"], 1, "Puisi lain berbunyi, “Sunyi senyap sendu sekali, senja singgah di sisi sepi.” Rani menghitung bunyi s yang muncul berkali-kali. Ia merasa pengulangan bunyi itu membuat puisi terdengar seperti desis angin yang berbisik di sore hari."], ["Pemilihan kata senja alih-alih sore pada teks menunjukkan penggunaan …", ["diksi", "rima", "larik", "bait"], 0, "Penyair itu menulis, “Senja meniti cakrawala.” Ketika ditanya, ia menjelaskan bahwa ia sengaja memilih kata senja dan bukan sore, karena kata senja terdengar lebih indah dan menimbulkan suasana syahdu. Rani mencatat penjelasan itu dalam bukunya."], ["Cara penulisan kutipan langsung pendek dalam laporan Rani adalah …", ["diapit tanda petik dan menyatu dengan teks", "ditulis miring tanpa tanda petik", "ditulis dalam tanda kurung", "dipisah dengan garis miring"], 0, "Dalam laporan, Rani mengutip pernyataan saksi, Pak Darman, secara langsung sepanjang dua baris. Ia menuliskannya persis seperti yang diucapkan dan mengapitnya dengan tanda petik. Ia tahu bahwa kutipan langsung yang kurang dari lima baris diapit tanda petik dan menyatu dengan teks."], ["Daftar pustaka dalam teks disusun dengan urutan …", ["abjad berdasarkan nama penulis", "tebal buku", "harga buku", "warna sampul"], 0, "Di akhir laporan, Rani menyusun daftar pustaka. Ia menulis nama penulis terlebih dahulu, lalu tahun terbit, judul buku, dan penerbit. Seluruh sumber ia urutkan dari huruf A sampai Z berdasarkan nama belakang penulis, sehingga pembaca mudah mencarinya."], ["Catatan hasil rapat seperti yang dibuat Sersan Budi disebut …", ["notula", "resensi", "editorial", "proposal"], 0, "Sersan Budi mencatat jalannya rapat tim detektif: waktu rapat, peserta, pokok pembahasan, serta keputusan yang diambil. Catatan itu dibagikan kepada semua anggota agar mereka mengingat tugas masing-masing. Rani menyebutnya dokumen penting hasil rapat."]],
is:[

["Pesan moral dalam sebuah cerpen disebut …",["amanat"]],

'<rect x="170" y="120" width="150" height="8" fill="#5b4636"/><rect x="190" y="50" width="12" height="70" fill="#7a3b2e"/><rect x="206" y="38" width="12" height="82" fill="#2f6f8f"/><rect x="222" y="56" width="12" height="64" fill="#e0a526"/><rect x="238" y="44" width="12" height="76" fill="#5a8f3e"/><rect x="254" y="60" width="12" height="60" fill="#8f3e6a"/><rect x="270" y="48" width="12" height="72" fill="#2f6f8f"/><g fill="none" stroke="#f1ead8" stroke-width="5"><circle cx="400" cy="80" r="20"/><path d="M414 95l22 22" stroke-linecap="round"/></g>',
'<rect x="250" y="58" width="100" height="66" fill="#efe6cf"/><path d="M250 58l50 38 50-38" fill="none" stroke="#9a8f70" stroke-width="3"/><circle cx="300" cy="96" r="10" fill="#c0392b"/><text x="420" y="90" font-size="44" fill="#ff6b6b" font-weight="800">!</text>',
'<rect x="255" y="34" width="90" height="88" rx="6" fill="#efe6cf"/><g stroke="#9a8f70" stroke-width="4"><path d="M270 56h60M270 72h60M270 88h40"/></g><path d="M380 120l40-60 10 6-40 60z" fill="#e0a526"/><circle cx="200" cy="90" r="18" fill="#070810"/>'];

function icon(n){return '<svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="#e0a526" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n%IC.length]+'</svg>'}
function endI(w){return '<svg class="ill" viewBox="0 0 600 90" aria-hidden="true"><rect width="600" height="90" rx="10" fill="'+(w?"#1e3a2a":"#3a1e26")+'"/>'+(w?'<g fill="none" stroke="#e0a526" stroke-width="7"><circle cx="270" cy="45" r="20"/><circle cx="330" cy="45" r="20"/><path d="M290 45h20"/></g>':'<g fill="#a9a58f" opacity=".6"><ellipse cx="200" cy="58" rx="90" ry="14"/><ellipse cx="390" cy="42" rx="110" ry="14"/></g><text x="300" y="62" font-size="44" fill="#ff6b6b" text-anchor="middle">?</text>')+'</svg>'}
var DB=null,UID=null,BOARD=[];
(async function(){try{if(!window.claude||!claude.use)return;var d=await claude.use("db"),u=await claude.use("user");if(!d)return;DB=d;UID=u?await u.id():null;
DB.collection("board").orderBy("score","desc").limit(30).onSnapshot(function(s){BOARD=s.docs.map(function(x){var v=x.data()||{};return{id:x.id,n:String(v.n||"?").slice(0,30),s:+v.score||0,t:+v.t||0,r:+v.r||0}});if(S.view==="lb")lb()},function(){})}catch(e){}})();
function save(){pres();try{if(!DB||!UID)return;var r=0;for(var k in S.done)if(S.done[k]>=PASS*PTS)r++;DB.collection("board").doc(UID).set({n:S.name,score:total(),t:Math.floor((Date.now()-S.t0)/1000),r:r}).catch(function(){})}catch(e){}}
function lb(){S.view="lb";S.inRoom=false;var me=total(),h='<div class="card"><h2>🏆 Peringkat Langsung</h2>'+live()+'</div><div class="card"><h2>📜 Rekor Tersimpan</h2>';
if(!DB)h+='<p class="mu">Rekor tersimpan hanya untuk yang masuk akun. Skormu saat ini: <b>'+me+'</b>.</p>';
else if(!BOARD.length)h+='<p class="mu">Belum ada detektif di papan. Jadilah yang pertama!</p>';
else{BOARD.slice().sort(function(a,b){return b.s-a.s||a.t-b.t}).forEach(function(x,k){h+='<div class="lbr"><b class="rk">'+(["🥇","🥈","🥉"][k]||(k+1)+".")+'</b><div style="flex:1;min-width:0"><b>'+esc(x.n)+(x.id===UID?" (kamu)":"")+'</b><div class="mu">'+x.r+' kasus selesai · '+fmt(x.t)+'</div></div><b>'+x.s+'</b></div>'})}
app.innerHTML=h+'</div><button class="btn" onclick="menu()">Kembali ke daftar kasus</button>';bar()}
var RM=null,PEERS=[];
(async function(){try{if(!window.claude||!claude.use)return;var m=await claude.use("room");if(!m)return;RM=m;m.onPeers(function(c){PEERS=c.peers.slice();if(S.view==="lb")lb()});PEERS=m.peers().slice();pres()}catch(e){}})();
function pres(){try{if(RM&&S.name)RM.presence({n:S.name,s:total()+(S.inRoom?S.rs:0),t:S.t0?Math.floor((Date.now()-S.t0)/1000):0}).catch(function(){})}catch(e){}}
function rows(){var L=PEERS.filter(function(p){return p.presence&&p.presence.n!=null}).map(function(p){var q=p.presence;return{id:p.peer,n:String(q.n).slice(0,30),s:+q.s||0,t:+q.t||0,me:p.isMe}});
if(!L.some(function(x){return x.me})&&S.name)L.push({id:"me",n:S.name,s:total()+(S.inRoom?S.rs:0),t:S.t0?Math.floor((Date.now()-S.t0)/1000):0,me:true});
return L.sort(function(a,b){return b.s-a.s||a.t-b.t})}
function live(){var L=rows();if(!L.length)return'<p class="mu">Belum ada pemain aktif.</p>';return L.map(function(x,k){return'<div class="lbr"><b class="rk">'+(["🥇","🥈","🥉"][k]||(k+1)+".")+'</b><div style="flex:1;min-width:0"><b>'+esc(x.n)+(x.me?" (kamu)":"")+'</b><div class="mu">⏱ '+fmt(x.t)+'</div></div><b>'+x.s+'</b></div>'}).join("")+(RM?'':'<p class="mu">Mode langsung belum tersedia di perangkat ini.</p>')}
function lockRead(n){var bs=document.querySelectorAll(".opt"),d=document.createElement("div");d.className="mu";d.id="rd";bs.forEach(function(b){b.disabled=true});if(!bs[0])return;bs[0].parentNode.insertBefore(d,bs[0]);var t=setInterval(function(){if(!$("rd")){clearInterval(t);return}n--;if(n<=0){clearInterval(t);bs.forEach(function(b){b.disabled=false});d.remove();return}d.textContent="📖 Baca ceritanya dulu… "+n+" detik"},1000);d.textContent="📖 Baca ceritanya dulu… "+n+" detik"}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim()}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function total(){var t=0;for(var k in S.done){if(S.inRoom&&+k===S.room)continue;t+=S.done[k]}return t}
function fmt(s){var m=Math.floor(s/60),x=s%60;return(m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function bar(){$("bN").textContent=S.name||"-";$("bR").textContent=S.q>=0&&S.inRoom?(S.room+1)+"/"+R.length:"-";$("bB").textContent=S.ok+"/20";$("bS").textContent=total()+(S.inRoom?S.rs:0);
var L=rows(),k=L.findIndex(function(x){return x.me});$("bP").textContent=k<0?"-":"#"+(k+1)+"/"+L.length;$("bT").textContent=fmt(S.t0?Math.floor((Date.now()-S.t0)/1000):0)}
function start(){var n=$("nm").value.trim();if(!n){$("nm").focus();return}S.name=n;S.t0=Date.now();S.tick=setInterval(bar,500);setInterval(pres,5000);pres();menu()}
function home(){app.innerHTML='<div class="card">'+ill(-1)+'<div class="hd">'+[0,1,2,3,4,5,6,7].map(icon).join("")+'</div><h1>🕵️ Detektif Bahasa</h1><p class="mu">Game TKA Bahasa Indonesia Kelas XII SMK · 3 kasus · tiap kasus 15 pilihan ganda + 5 isian singkat</p><p>Kota Aksara dilanda tiga kasus misterius. Hanya detektif yang menguasai Bahasa Indonesia yang bisa memecahkannya. Siap bertugas?</p><p>Aturan: jawab minimal <b>15 dari 20</b> soal dengan benar untuk memecahkan kasus dan membuka kasus berikutnya. Setiap jawaban benar bernilai 5 poin. Skor dan waktu terlihat di bagian bawah layar.</p><input type="text" id="nm" placeholder="Nama detektif (nama / kelas)" maxlength="30"><button class="btn" onclick="start()">Mulai Menyelidiki</button></div>';S.inRoom=false;bar()}
function menu(){S.inRoom=false;S.ok=0;var h='<div class="card"><h2>🗂️ Daftar Kasus</h2>';
R.forEach(function(r,i){var op=i<S.unlocked,dn=S.done[i]!==undefined;
h+='<div class="room"><div><b>'+r.c+'</b><div class="mu">'+r.t+' · '+(dn?"Skor terbaik: "+S.done[i]:"20 soal")+'</div></div>'+(op?'<button class="btn" onclick="play('+i+')">'+(dn?"Selidiki ulang":"Selidiki")+'</button>':'<span class="tag">🔒 Terkunci</span>')+'</div>'});
if(S.unlocked>R.length||S.done[R.length-1]!==undefined&&S.done[R.length-1]>=PASS*PTS)h+='<p class="fb ok">Selamat, Detektif! Semua kasus terpecahkan. Skor total: '+total()+' · Waktu: '+fmt(Math.floor((Date.now()-S.t0)/1000))+'</p>';
app.innerHTML=h+'</div><button class="btn" onclick="lb()">🏆 Papan Peringkat</button>';S.view="m";bar()}
function play(i){S.room=i;S.q=0;S.ok=0;S.rs=0;S.inRoom=true;S.locked=false;show()}
function qs(){var r=R[S.room];return r.mc.length+r.is.length}
function show(){var r=R[S.room],n=r.mc.length,i=S.q,mc=i<n,q=mc?r.mc[i]:r.is[i-n];S.locked=false;
var h='<div class="card">'+ill(S.room)+'<div class="hd">'+icon(i)+'<span class="tag">'+r.c+' · '+r.t+'</span></div><div class="pb"><i style="width:'+(i/qs()*100)+'%"></i></div><p class="mu">Soal '+(i+1)+' dari '+qs()+(mc?' · Pilihan ganda':' · Isian singkat')+'</p>'+(mc?'<div class="story"><b>📖 '+(q[3]?"Teks "+(i+1):"Bab "+(Math.floor(i/3)+1)+" dari 5")+'</b>'+(q[3]||r.ch[Math.floor(i/3)]).split("\n").map(function(t){return"<p>"+esc(t)+"</p>"}).join("")+'</div>':'')+'<h2>🔍 '+esc(q[0])+'</h2>';
if(mc){q[1].forEach(function(o,k){h+='<button class="opt" onclick="pick('+k+')">'+"ABCD"[k]+". "+esc(o)+'</button>'})}
else h+='<input type="text" id="ans" placeholder="Ketik jawabanmu" autocomplete="off" onkeydown="if(event.key===\'Enter\')cek()"><button class="btn" id="ck" onclick="cek()">Periksa</button>';
app.innerHTML=h+'<div id="fb"></div></div>';if(!mc)$("ans").focus();else{S.seen=S.seen||{};var ck=S.room+"-"+(q[3]?"q"+i:Math.floor(i/3));if((q[3]||i%3==0)&&!S.seen[ck]){S.seen[ck]=1;lockRead(q[3]?20:25)}}bar()}
function judge(good,key){if(S.locked)return;S.locked=true;if(good){S.ok++;S.rs+=PTS}
var f=$("fb");f.innerHTML='<p class="fb '+(good?"ok":"no")+'">'+(good?"✅ Petunjuk ditemukan! +"+PTS+" poin":"❌ Petunjuk meleset."+(key?" Jawaban: "+esc(key):""))+'</p><button class="btn" onclick="next()">'+(S.q+1>=qs()?"Lihat hasil":"Lanjut")+'</button>';pres();bar()}
function pick(k){if(S.locked)return;var q=R[S.room].mc[S.q],bs=document.querySelectorAll(".opt");bs.forEach(function(b,j){b.disabled=true;if(j===q[2])b.classList.add("ok");else if(j===k)b.classList.add("no")});judge(k===q[2],"ABCD"[q[2]]+". "+q[1][q[2]])}
function cek(){if(S.locked)return;var r=R[S.room],q=r.is[S.q-r.mc.length],a=norm($("ans").value);if(!a){$("ans").focus();return}
$("ans").disabled=true;$("ck").disabled=true;judge(q[1].some(function(x){return norm(x)===a}),q[1][0])}
function next(){S.q++;if(S.q<qs())show();else end()}
function end(){var win=S.ok>=PASS,sc=S.rs,i=S.room;
if(S.done[i]===undefined||sc>S.done[i])S.done[i]=sc;
if(win&&S.unlocked<=i+1)S.unlocked=Math.min(i+2,R.length+1);S.inRoom=false;save();
S.inRoom=false;
app.innerHTML='<div class="card">'+ill(i)+endI(win)+'<h1>'+(win?"Kasus terpecahkan!":"Kasus belum terpecahkan")+'</h1><div class="stamp'+(win?"":" no")+'">'+(win?"SOLVED":"COLD CASE")+'</div><p>Petunjuk benar: <b>'+S.ok+'/20</b> · Skor: <b>'+sc+'</b></p><p>'+(win?esc(R[i].p)+(i+1<R.length?" Kasus berikutnya terbuka.":""):"Butuh minimal "+PASS+" petunjuk benar untuk mengungkap pelaku. Coba lagi!")+'</p><button class="btn" onclick="menu()">Kembali ke daftar kasus</button> <button class="btn" onclick="lb()">🏆 Peringkat</button></div>';
S.ok=0;S.rs=0;bar()}
home();
